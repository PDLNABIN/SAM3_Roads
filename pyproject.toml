[project]
name = "sam3-roads"
version = "0.1.0"
description = "SAM3 + LoRA training pipeline for binary road segmentation from drone imagery."
authors = [{ name = "Nabin Poudel" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "albumentations>=2.0",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "opencv-python>=4.9",
    "pandas>=2.0",
    "peft>=0.11",
    "rasterio>=1.3",
    "tomli>=2.0; python_version < '3.11'",
    "torch>=2.0",
    "tqdm>=4.66",
    "transformers>=4.52",
]

[project.optional-dependencies]
cuda-training = [
    "bitsandbytes>=0.43; platform_system != 'Windows'",
]

[project.scripts]
sam3-roads = "sam3_roads.cli:main"

[tool.poetry]
packages = [{ include = "sam3_roads" }]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
